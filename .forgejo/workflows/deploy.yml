# Costruisce il sito e lo sincronizza sulla Storage Zone di Bunny, che fa da
# origine alla Pull Zone servita su nulltype.org.
#
# L'homelab non riceve mai traffico in ingresso: la CI gira in casa ma parla
# solo in uscita verso Bunny, che serve i file agli utenti.
#
# Si usa l'API S3 della storage zone invece di quella nativa perche' permette
# 'sync': carica solo i file cambiati e soprattutto CANCELLA quelli che non
# esistono piu'. Con un upload puro una pagina rimossa resterebbe servita per
# sempre. L'S3 di Bunny e' in public preview; se dovesse dare problemi si torna
# all'API nativa, che e' un semplice PUT per file.
#
# Segreti richiesti sul repository (Settings -> Actions -> Secrets):
#   BUNNY_STORAGE_ZONE      nome della storage zone (e' anche l'access key S3)
#   BUNNY_STORAGE_PASSWORD  password da "FTP & Access" (e' anche il secret S3)
#   BUNNY_S3_ENDPOINT       es. https://de-s3.storage.bunnycdn.com per Frankfurt
#   BUNNY_S3_REGION         es. de
#   BUNNY_API_KEY           API key dell'account, serve solo per la purge
#   BUNNY_PULLZONE_ID       id numerico della pull zone
name: Deploy to Bunny

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # ATTENZIONE al nome: rclone interpreta OGNI variabile d'ambiente che inizia
  # per RCLONE_ come uno dei suoi flag. Chiamarla RCLONE_VERSION equivaleva a
  # passare --version, che e' booleano, e faceva fallire il comando con
  # "strconv.ParseBool". Per questo il prefisso e' diverso.
  #
  # La versione e' fissata di proposito: una che cambia da sola sotto i piedi
  # e' il modo piu' rapido per avere una build che ieri funzionava e oggi no.
  SYNC_TOOL_VERSION: v1.75.1

jobs:
  deploy:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Bunny serve la pagina d'errore personalizzata da bunnycdn_errors/404.html
      # nella storage zone. La si mette dentro dist/ invece di caricarla a mano
      # una volta sola: cosi' entra nel sync, resta allineata a ogni build e non
      # viene cancellata da --delete come accadrebbe a un file esterno all'albero.
      - name: Prepare Bunny error page
        run: |
          set -euo pipefail
          mkdir -p dist/bunnycdn_errors
          cp dist/404.html dist/bunnycdn_errors/404.html

      - name: Install rclone
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq unzip
          curl -fsSL -o /tmp/rclone.zip \
            "https://downloads.rclone.org/${SYNC_TOOL_VERSION}/rclone-${SYNC_TOOL_VERSION}-linux-amd64.zip"
          unzip -qj /tmp/rclone.zip '*/rclone' -d /usr/local/bin
          chmod +x /usr/local/bin/rclone
          rclone version

      - name: Sync to Bunny Storage
        env:
          # rclone si configura interamente da variabili d'ambiente: nessun file
          # di config da scrivere, e i segreti non toccano il disco.
          RCLONE_CONFIG_BUNNY_TYPE: s3
          RCLONE_CONFIG_BUNNY_PROVIDER: Other
          RCLONE_CONFIG_BUNNY_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          RCLONE_CONFIG_BUNNY_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          RCLONE_CONFIG_BUNNY_ENDPOINT: ${{ secrets.BUNNY_S3_ENDPOINT }}
          RCLONE_CONFIG_BUNNY_REGION: ${{ secrets.BUNNY_S3_REGION }}
          ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
        run: |
          set -euo pipefail
          # --checksum invece del confronto per data: la build rigenera i file
          # a ogni esecuzione, quindi le date cambiano sempre e un confronto su
          # quelle ricaricherebbe tutto ogni volta.
          rclone sync dist "bunny:${ZONE}" \
            --checksum \
            --transfers 8 \
            --s3-no-check-bucket \
            --stats-one-line \
            --verbose

      - name: Purge pull zone
        env:
          API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          set -euo pipefail
          curl -sS --fail -X POST \
            -H "AccessKey: ${API_KEY}" \
            "https://api.bunny.net/pullzone/${PULLZONE_ID}/purgeCache"
          echo "cache invalidata"
